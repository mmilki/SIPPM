<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPPG - Akuntan: Surat Permintaan Pembayaran</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f3f5f9;color:#1c2438}
.bar{background:#14305c;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{max-width:1250px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
input,select{padding:7px 8px;border:1px solid #cfd6e4;border-radius:7px;font:inherit;width:100%}
button{padding:8px 13px;border:0;border-radius:8px;background:#14305c;color:#fff;font:inherit;cursor:pointer}
button.l{background:#e6ebf5;color:#14305c}button.g{background:#1f9d55}button.x{background:#d64545;padding:6px 9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs button{background:#e6ebf5;color:#14305c}.tabs .on{background:#14305c;color:#fff}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:4px;border-bottom:1px solid #e3e8f2;text-align:left;vertical-align:middle}
th{font-size:12px;color:#5b6783}.r{text-align:right}.tot{font-size:18px;font-weight:700;margin-top:10px;text-align:right}
#login{max-width:340px;margin:12vh auto}.err{color:#d64545;margin-top:8px}details input{margin-bottom:6px}
#printArea{display:none}
@media print{@page{size:A4 landscape;margin:12mm}body>*:not(#printArea){display:none!important}#printArea{display:block}
.page{page-break-after:always;font:12px 'Times New Roman',serif;color:#000}.page:last-child{page-break-after:auto}
.page table{font-size:11px}.page th,.page td{border:1px solid #000;padding:3px 5px;color:#000}.page th{background:#eee}}
.page h3{text-align:center;margin:10px 0 2px}.page .c{text-align:center}.sig{display:flex;justify-content:space-between;margin-top:18px}.sig div{text-align:center;min-width:200px}
</style></head><body>
<div id="login" class="card"><h2>Login Akuntan SPPG</h2>
<p><input id="u" placeholder="Username"></p><p><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"></p>
<button onclick="login()">Masuk</button><div class="err" id="le"></div></div>

<div id="app" hidden>
<div class="bar"><b>SPPG &middot; Surat Permintaan Pembayaran</b><span><span id="who"></span> <button class="l" onclick="logout()">Keluar</button></span></div>
<div class="wrap">
<div class="card row">
<label>Tanggal MBG <input type="date" id="tgl" onchange="loadDay()" style="width:auto"></label>
<button class="l" onclick="copyPrev()">Salin dari hari sebelumnya</button>
<button class="g" onclick="save()">Simpan</button>
<button onclick="pr(['p'])">Cetak Pangan</button><button onclick="pr(['o'])">Cetak Operasional</button><button onclick="pr(['p','o'])">Cetak Keduanya</button>
<span id="msg"></span></div>
<div class="card"><div class="row tabs"><button id="tp" onclick="setTab('p')">Belanja Bahan Pangan</button><button id="to" onclick="setTab('o')">Belanja Operasional</button></div>
<div class="sc" id="tbl"></div><div class="tot" id="sum"></div></div>
<div class="card"><details><summary><b>Pengaturan (pejabat, supplier, instansi)</b></summary><div id="cfg" style="margin-top:10px"></div><button onclick="saveMaster().then(()=>say('Pengaturan tersimpan'))">Simpan Pengaturan</button></details></div>
</div></div>
<datalist id="dlp"></datalist><datalist id="dlo"></datalist>
<div id="printArea"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwYMbNqmvQPVjHxB7fgpbGOnBsiySmfOMyqJiYyVZWfNLNcMtitbJy9KDgcPYqb63Wc7Q/exec';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
let S=JSON.parse(sessionStorage.getItem('ak')||'null'),M=null,D={p:[],o:[]},tab='p';
const bp=()=>({n:'',q:1,s:'',h:0}),bo=()=>({g:'',n:'',q:1,s:'',h:0,r:'',b:'',e:''});
const say=t=>{$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3500)};
async function api(m,p){p={...p};if(S)p.token=S.token;const r=m==='GET'?await fetch(API_URL+'?'+new URLSearchParams(p)):await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});const d=await r.json();if(!d.ok)throw new Error(d.error||d.message||'Gagal');return d}
async function login(){try{const d=await api('POST',{action:'login',username:$('u').value,password:$('pw').value});
 if(!['akuntan','admin'].includes(String(d.role).toLowerCase()))throw new Error('Akun ini bukan akun akuntan.');
 S={token:d.token,name:d.user.username};sessionStorage.setItem('ak',JSON.stringify(S));start()}catch(e){$('le').textContent=e.message}}
function logout(){sessionStorage.removeItem('ak');location.reload()}
function seed(){const P='BERAS TOPI KOKI (10 KG)|KARUNG|155000;BERAS TOPI KOKI (20 KG)|KARUNG|310000;TELUR AYAM|KG|26000;AYAM POTONG|KG|41000;MINYAK FORTUNE 1L|KG|22000;TEMPE|PAPAN|5000;TAHU KUNING|PAPAN|1000;SAWI|KG|10000;WORTEL|KG|17000;LABU SIAM|KG|13000;PISANG PUTRI|KG|7500;SEMANGKA|KG|13000;SUSU ULTRA MILK 125ML|CRT|135000;GULA MERAH|KG|28000;GARAM HALUS|BKS|2000;GARAM KASAR|BKS|5000;GULA PASIR|KG|18500;TOTOLE|PACK|14000;BAWANG PUTIH KUPAS|KG|35000;BAWANG MERAH KUPAS|KG|25000;TOMAT|KG|15000;CABE MERAH|KG|40000;JAHE|KG|16000;LENGKUAS|KG|16000;KUNYIT|KG|13000;SERAI|KG|10000;DAUN SALAM|IKAT|5000;BUMBU MARINASI|PACK|11500;KECAP MANIS INDOFOOD 5,7KG|DRG|135000';
 const O='Gas Elpiji|Tabung|260000||Mandiri|112-00-2513370-8|Henita Maxdalena;Air Minum Isi Ulang|Galon|5000||Mandiri|112-00-2707766-3|Redi Presli;Mama Lemon 610 ml|Pcs|10000|Alat Kebersihan;Kantong Sampah Krisbow|Roll|119000|Alat Kebersihan;Masker|Kotak|28000|APD;Sarung Tangan Plastik|Kotak|15000|APD;Hairnet|Kotak|55000|APD;Kertas Thermal 100x150mm (label)|Roll|22500|ATK;Isolasi Buah & Sayur 18mm|Roll|3500|ATK';
 const m={p:{},o:{},c:{unit:'SPPG POLRES OGAN ILIR 4 SUNGAI PINANG LAGATI',yay:'Yayasan Kemala Bhayangkari',kota:'Ogan Ilir',kepala:'M. Milki, S.Pd.',nip:'200104212026211007',akun:'Manisa Agustina S.E.',sn:'Koperasi Sinergi Putri Cemerlang',sb:'Mandiri',sr:'112-00-2703011-8'}};
 P.split(';').forEach(x=>{const a=x.split('|');m.p[a[0]]=[a[1],+a[2]]});
 O.split(';').forEach(x=>{const a=x.split('|');m.o[a[0]]=[a[1],+a[2],a[3]||'',a[5]||'',a[4]||'',a[6]||'']});return m}
async function start(){$('login').hidden=true;$('app').hidden=false;$('who').textContent=S.name;
 try{const d=await api('GET',{action:'sppMaster'});M=d.master&&d.master.c?d.master:seed()}catch(e){M=seed();say(e.message)}
 $('tgl').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
 cfgUI();dl();loadDay()}
function dl(){['p','o'].forEach(t=>$('dl'+t).innerHTML=Object.keys(M[t]).map(k=>`<option value="${esc(k)}">`).join(''))}
function cfgUI(){const L={unit:'Nama SPPG',yay:'Yayasan',kota:'Kota (tanda tangan)',kepala:'Kepala SPPG',nip:'NIP Kepala',akun:'Akuntan',sn:'Supplier pangan',sb:'Bank supplier',sr:'No. rekening supplier'};
 $('cfg').innerHTML=Object.keys(L).map(k=>`<label>${L[k]}<input value="${esc(M.c[k])}" oninput="M.c['${k}']=this.value"></label>`).join('')}
async function loadDay(){try{const d=await api('GET',{action:'sppGet',tanggal:$('tgl').value});D=d.data||{p:[bp()],o:[bo()]}}catch(e){D={p:[bp()],o:[bo()]};say(e.message)}render()}
async function copyPrev(){try{const d=await api('GET',{action:'sppLast',before:$('tgl').value});if(!d.data)return say('Belum ada data hari sebelumnya');D=d.data;render();say('Disalin dari '+d.tanggal+'. Sesuaikan qty/harga.')}catch(e){say(e.message)}}
function setTab(t){tab=t;render()}
const sum=t=>D[t].reduce((a,r)=>a+r.q*r.h,0);
function tot(){$('sum').textContent='Total '+(tab==='p'?'Pangan':'Operasional')+': '+rp(sum(tab))}
function ed(t,i,k,v){D[t][i][k]=(k==='q'||k==='h')?(+v||0):v;tot();const c=$('t'+t+i);if(c)c.textContent=rp(D[t][i].q*D[t][i].h)}
function pick(t,i,v){const r=D[t][i];r.n=v;const m=M[t][v];if(m){r.s=m[0];r.h=m[1];if(t==='o'){r.g=m[2];r.r=m[3];r.b=m[4];r.e=m[5]}}render()}
function add(t){D[t].push(t==='p'?bp():bo());render()}function del(t,i){D[t].splice(i,1);if(!D[t].length)D[t].push(t==='p'?bp():bo());render()}
function render(){$('tp').className=tab==='p'?'on':'';$('to').className=tab==='o'?'on':'';const t=tab,o=t==='o';
 const f=(i,k,ph,w,ty)=>`<td><input ${ty?'type=number min=0 step=any':''} value="${esc(D[t][i][k])}" placeholder="${ph}" style="min-width:${w}px" oninput="ed('${t}',${i},'${k}',this.value)"></td>`;
 $('tbl').innerHTML=`<table><tr><th>#</th>${o?'<th>Kategori</th>':''}<th>Nama</th><th>Qty</th><th>Satuan</th><th>Harga</th><th>Total</th>${o?'<th>Rekening</th><th>Bank</th><th>Penerima</th>':''}<th></th></tr>`+
 D[t].map((r,i)=>`<tr><td>${i+1}</td>${o?f(i,'g','APD, ATK...',90):''}<td><input list="dl${t}" value="${esc(r.n)}" style="min-width:190px" onchange="pick('${t}',${i},this.value)"></td>${f(i,'q','',60,1)}${f(i,'s','',70)}${f(i,'h','',95,1)}<td class="r" id="t${t}${i}">${rp(r.q*r.h)}</td>${o?f(i,'r','',130)+f(i,'b','',70)+f(i,'e','',110):''}<td><button class="x" onclick="del('${t}',${i})">✕</button></td></tr>`).join('')+
 `</table><p><button class="l" onclick="add('${t}')">+ Tambah baris</button></p>`;tot()}
async function saveMaster(){await api('POST',{action:'sppSaveMaster',master:M})}
async function save(){try{['p','o'].forEach(t=>{D[t]=D[t].filter(r=>r.n.trim());if(!D[t].length)D[t]=[t==='p'?bp():bo()];D[t].forEach(r=>{if(r.n)M[t][r.n]=t==='p'?[r.s,r.h]:[r.s,r.h,r.g,r.r,r.b,r.e]})});
 await api('POST',{action:'sppSave',tanggal:$('tgl').value,data:D});await saveMaster();dl();render();say('Tersimpan ✓')}catch(e){say(e.message)}}
const tg=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
function letter(t){const c=M.c,d=$('tgl').value,p=t==='p',rows=D[t].filter(r=>r.n),cs=p?9:9;let b='',no=0,lg=null;
 rows.forEach((r,i)=>{const T=`<td class="r">${rp(r.h)}</td><td class="r">${rp(r.q*r.h)}</td>`;
  if(p)b+=`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.q}</td><td>${esc(r.s)}</td>${T}${i?'':`<td rowspan="${rows.length}">${esc(c.sr)}</td><td rowspan="${rows.length}">${esc(c.sb)}</td><td rowspan="${rows.length}">${esc(c.sn)}</td>`}</tr>`;
  else{if(r.g&&r.g!==lg){no++;b+=`<tr><td>${no}</td><td colspan="8"><b>${esc(r.g)}</b></td></tr>`}if(!r.g)no++;lg=r.g;
   b+=`<tr><td>${r.g?'':no}</td><td>${esc(r.n)}</td><td>${r.q}</td><td>${esc(r.s)}</td>${T}<td>${esc(r.r)}</td><td>${esc(r.b)}</td><td>${esc(r.e)}</td></tr>`}});
 const jn=p?'Bahan Pangan':'Operasional';
 return `<div class="page"><p>Sifat : Segera<br>Perihal : Permintaan Pembayaran Dana Belanja ${jn}.<br><br>Kepada Yth.<br>Ketua ${esc(c.yay)}<br>Di Tempat</p>
 <h3>SURAT PERMINTAAN PEMBAYARAN</h3><p>Sehubungan dengan pelaksanaan kegiatan Makan Bergizi Gratis Tanggal ${tg(d)}. Di ${esc(c.unit)}, maka kami mengajukan permintaan Pembayaran ${p?'Dana Belanja Bahan Pangan':'Belanja Operasional'} kepada pihak ${esc(c.yay)} dengan rincian sebagai berikut :</p>
 <p class="c"><b>REKAP BIAYA ${p?'BAHAN PANGAN':'OPERASIONAL'}<br>${esc(c.unit)}<br>${new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()}</b></p>
 <table><tr><th>No</th><th>${p?'Nama Bahan Baku':'Nama Barang'}</th><th>Qty</th><th>Satuan</th><th>Harga Satuan</th><th>Total Harga</th><th>No. Rekening</th><th>Nama Bank</th><th>${p?'Nama Supplier':'Nama Penerima'}</th></tr>${b}
 <tr><td colspan="5" class="r"><b>${p?'TOTAL':'TOTAL KESELURUHAN'}</b></td><td class="r"><b>${rp(sum(t))}</b></td><td colspan="3"></td></tr></table>
 <p>Demikian surat permintaan pembayaran ini kami buat dan ajukan untuk digunakan sebagaimana mestinya atas perhatiannya kami ucapkan terimakasih.</p>
 <div class="sig"><div>Menyetujui,<br>Kepala SPPG<br><br><br><br><u>${esc(c.kepala)}</u><br>NIP. ${esc(c.nip)}</div><div>${esc(c.kota)}, ${tg(d)}<br>Akuntan SPPG<br><br><br><br><u>${esc(c.akun)}</u></div></div></div>`}
function pr(k){$('printArea').innerHTML=k.map(letter).join('');window.print()}
if(S)start();
</script></body></html>
