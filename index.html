<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPPG Ogan Ilir Sungai Pinang III</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --navy:#071e49;
  --green:#92d05d;
  --blue:#b5e0ea;
  --gold:#d1b06c;
  --white:#fff;
  --bg:#f4f7fb;
  --text:#172033;
  --muted:#6b7280;
  --danger:#dc3545;
  --shadow:0 10px 30px rgba(7,30,73,.10);
  --radius:18px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--navy);
  color:#fff;
  padding:15px 22px;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}
.header-inner{
  max-width:1400px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.brand{
  font-weight:800;
  letter-spacing:.5px;
}
.brand small{
  display:block;
  font-size:12px;
  opacity:.75;
  margin-top:4px;
}
.container{
  max-width:1400px;
  margin:auto;
  padding:22px;
}

.card{
  background:#fff;
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-card{
  width:min(430px,100%);
}
.logo-box{
  text-align:center;
  margin-bottom:25px;
}
.logo-circle{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:24px;
}

h1,h2,h3{margin-top:0}
h2{font-size:22px}
h3{font-size:17px}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}
input,select,textarea{
  width:100%;
  border:1px solid #d7dce5;
  border-radius:12px;
  padding:11px 13px;
  background:#fff;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(7,30,73,.08);
}
textarea{min-height:100px;resize:vertical}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}
.form-group.full{grid-column:1/-1}

.btn{
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-weight:700;
  background:#e9edf3;
  color:var(--text);
}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--navy);color:#fff}
.btn-success{background:var(--green);color:#173000}
.btn-danger{background:var(--danger);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-blue{background:var(--blue);color:#073342}
.btn-light{background:#f1f3f6}
.btn-sm{padding:7px 10px;font-size:12px}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}
.stat{
  border-radius:16px;
  padding:18px;
  color:#fff;
  background:var(--navy);
}
.stat:nth-child(2){background:#27834a}
.stat:nth-child(3){background:#387f99}
.stat:nth-child(4){background:#8b6c2c}
.stat .num{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}
.tab{
  border:0;
  padding:9px 14px;
  border-radius:20px;
  background:#e9edf3;
  font-weight:700;
}
.tab.active{
  background:var(--navy);
  color:#fff;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}
.category{
  border:2px solid #e2e7ee;
  border-radius:15px;
  padding:15px;
  background:#fff;
  text-align:center;
  cursor:pointer;
  font-weight:800;
}
.category.active{
  border-color:var(--green);
  background:#f2fbe9;
}

.table-wrap{
  overflow:auto;
  border:1px solid #e7ebf0;
  border-radius:14px;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}
th,td{
  border-bottom:1px solid #edf0f4;
  padding:10px 12px;
  text-align:left;
  font-size:13px;
  vertical-align:middle;
}
th{
  background:#f7f9fc;
  color:#475569;
}
tr:hover td{background:#fafcff}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  background:#eaf0f7;
}
.badge-green{background:#e8f7df;color:#276000}
.badge-red{background:#fde8ea;color:#9d1623}

.announcement{
  border-left:5px solid var(--green);
  background:#f8fcf4;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}
.announcement .date{
  color:var(--muted);
  font-size:12px;
}
.announcement h3{margin-bottom:7px}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal.show{display:flex}
.modal-box{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:22px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:15px;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.65);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
}
.loading.show{display:flex}
.spinner{
  width:45px;
  height:45px;
  border:5px solid #ddd;
  border-top-color:var(--navy);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:300;
  padding:13px 17px;
  background:var(--navy);
  color:#fff;
  border-radius:12px;
  box-shadow:var(--shadow);
  display:none;
  max-width:350px;
}
.toast.show{display:block}
.toast.error{background:var(--danger)}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.admin-menu{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .container{padding:13px}
  .form-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .category-grid{grid-template-columns:1fr}
  .header-inner{align-items:flex-start}
}
</style>
</head>

<body>

<div id="app"></div>

<div id="loading" class="loading">
  <div class="spinner"></div>
</div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
/* =========================================================
   KONFIGURASI
========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbztnSkQofFu6kycfpE1oGxVjPxcgn2hi6Oj3fGOX4w6wXmwilBSpRXatcMYfMUn03tZYw/exec';

const SESSION_KEY='sppg_session';

let session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
let activeTab='';
let posyanduCategory='Balita';
let editRow=null;

const cache={};

/* =========================================================
   HELPER
========================================================= */

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function showLoading(v=true){
  document.getElementById('loading').classList.toggle('show',v);
}

function toast(msg,error=false){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast show'+(error?' error':'');
  setTimeout(()=>el.className='toast',3000);
}

function saveSession(){
  localStorage.setItem(SESSION_KEY,JSON.stringify(session));
}

function logout(){
  localStorage.removeItem(SESSION_KEY);
  session=null;
  render();
}

async function apiGet(params={}){
  const p=new URLSearchParams(params);
  if(session?.token)p.set('token',session.token);

  const r=await fetch(API_URL+'?'+p.toString());
  const data=await r.json();

  if(!data.ok)throw new Error(data.message||'Terjadi kesalahan');
  return data;
}

async function apiPost(data={}){
  if(session?.token)data.token=session.token;

  const r=await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(data)
  });

  const result=await r.json();

  if(!result.ok)throw new Error(result.message||'Terjadi kesalahan');
  return result;
}

function normalizeGender(v){
  const x=String(v||'').trim().toUpperCase();

  if(['L','LAKI','LAKI-LAKI','LAKI LAKI','PRIA','M'].includes(x))
    return 'Laki-laki';

  if(['P','PEREMPUAN','WANITA','W'].includes(x))
    return 'Perempuan';

  return String(v||'').trim();
}

function formatDate(v){
  if(!v)return '';

  const d=new Date(v);
  if(isNaN(d))return v;

  return d.toLocaleDateString('id-ID');
}

/* =========================================================
   FIELD
========================================================= */

function fieldsFor(type){
  const common=[
    ['nama','Nama'],
    ['nik','NIK'],
    ['tgl','Tanggal Lahir']
  ];

  if(type==='siswa'){
    return [
      ...common,
      ['nisn','NISN'],
      ['jenisKelamin','Jenis Kelamin']
    ];
  }

  if(type==='guru'){
    return [
      ...common,
      ['jenisKelamin','Jenis Kelamin']
    ];
  }

  if(type==='tendik'){
    return [
      ...common,
      ['jenisKelamin','Jenis Kelamin']
    ];
  }

  if(type==='penjaga'){
    return [
      ...common,
      ['jenisKelamin','Jenis Kelamin']
    ];
  }

  if(type==='posyandu'){
    return [
      ['kategori','Kategori'],
      ...common,
      ['jenisKelamin','Jenis Kelamin'],
      ['usiaKehamilan','Usia Kehamilan / Trimester']
    ];
  }

  return common;
}

function typeLabel(type){
  return {
    siswa:'Siswa',
    guru:'Guru',
    tendik:'Tendik',
    penjaga:'Penjaga Sekolah',
    posyandu:'Posyandu'
  }[type]||type;
}

/* =========================================================
   VALIDASI
========================================================= */

function validateRow(obj,type){
  if(!obj.nama?.trim())
    return 'Nama wajib diisi.';

  if(!/^\d{16}$/.test(String(obj.nik||'')))
    return 'NIK harus tepat 16 angka.';

  if(type==='siswa'){
    if(!/^\d{5,10}$/.test(String(obj.nisn||'')))
      return 'NISN harus berupa 5–10 angka.';
  }

  if(!obj.tgl)
    return 'Tanggal lahir wajib diisi.';

  const d=new Date(obj.tgl);
  if(isNaN(d))
    return 'Tanggal lahir tidak valid.';

  if(d>new Date())
    return 'Tanggal lahir tidak boleh lebih besar dari hari ini.';

  if(!['siswa','guru','tendik','penjaga'].includes(type) &&
     type!=='posyandu')
    return 'Jenis data tidak valid.';

  if(!obj.jenisKelamin)
    return 'Jenis kelamin wajib dipilih.';

  obj.jenisKelamin=normalizeGender(obj.jenisKelamin);

  if(!['Laki-laki','Perempuan'].includes(obj.jenisKelamin))
    return 'Jenis kelamin harus Laki-laki atau Perempuan.';

  if(type==='posyandu'){
    if(!['Balita','Ibu Hamil','Ibu Menyusui'].includes(obj.kategori))
      return 'Kategori Posyandu tidak valid.';

    if(obj.kategori==='Ibu Hamil'){
      const usia=String(obj.usiaKehamilan||'').trim();

      if(!/^[123]$/.test(usia))
        return 'Usia kehamilan harus angka 1, 2, atau 3.';
    }else{
      obj.usiaKehamilan='';
    }
  }

  return '';
}

/* =========================================================
   CACHE
========================================================= */

function cacheKey(type){
  return [
    session?.unitName||'',
    session?.unitType||'',
    type
  ].join('|');
}

function getCached(type){
  return cache[cacheKey(type)]||null;
}

function setCached(type,rows){
  cache[cacheKey(type)]=rows||[];
}

function clearCache(){
  Object.keys(cache).forEach(k=>delete cache[k]);
}

/* =========================================================
   RENDER
========================================================= */

function render(){
  if(!session){
    renderLogin();
    return;
  }

  if(session.role==='admin'){
    renderAdmin();
    return;
  }

  renderUnit();
}

function renderLogin(){
  document.getElementById('app').innerHTML=`
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo-box">
        <div class="logo-circle">SPPG</div>
        <h2 style="margin:15px 0 5px">
          SPPG Ogan Ilir Sungai Pinang III
        </h2>
        <div style="color:#6b7280">
          Sistem Data Penerima Manfaat
        </div>
      </div>

      <form onsubmit="doLogin(event)">
        <div style="margin-bottom:14px">
          <label>Username</label>
          <input id="loginUser" required autocomplete="username">
        </div>

        <div style="margin-bottom:18px">
          <label>Password</label>
          <input id="loginPass" type="password" required autocomplete="current-password">
        </div>

        <button class="btn btn-primary" style="width:100%">
          Masuk
        </button>
      </form>
    </div>
  </div>`;
}

async function doLogin(e){
  e.preventDefault();

  try{
    showLoading();

    const data=await apiPost({
      action:'login',
      username:document.getElementById('loginUser').value.trim(),
      password:document.getElementById('loginPass').value
    });

    session=data;
    saveSession();
    render();

  }catch(err){
    toast(err.message,true);
  }finally{
    showLoading(false);
  }
}

/* =========================================================
   UNIT
========================================================= */

async function renderUnit(){
  const isPosyandu=session.unitType==='posyandu';

  if(!activeTab){
    activeTab=isPosyandu?'posyandu':'siswa';
  }

  document.getElementById('app').innerHTML=`
  <header>
    <div class="header-inner">
      <div class="brand">
        SPPG OGAN ILIR SUNGAI PINANG III
        <small>${esc(session.unitName||'')}</small>
      </div>

      <button class="btn btn-light btn-sm" onclick="logout()">
        Keluar
      </button>
    </div>
  </header>

  <main class="container">

    <div class="card">
      <div class="top-actions">
        <div>
          <h2 style="margin-bottom:5px">
            ${esc(session.unitName||'')}
          </h2>
          <div style="color:#6b7280">
            Data Penerima Manfaat
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="openProfile()">
            Profil
          </button>
        </div>
      </div>
    </div>

    <div id="announcementBox"></div>

    <div class="card">
      <div class="stats" id="unitStats"></div>
    </div>

    <div class="card">

      <div class="tabs">
        ${
          isPosyandu
          ? `<button class="tab active">Posyandu</button>`
          : `
            <button class="tab ${activeTab==='siswa'?'active':''}"
              onclick="switchTab('siswa')">Siswa</button>

            <button class="tab ${activeTab==='guru'?'active':''}"
              onclick="switchTab('guru')">Guru</button>

            <button class="tab ${activeTab==='tendik'?'active':''}"
              onclick="switchTab('tendik')">Tendik</button>

            <button class="tab ${activeTab==='penjaga'?'active':''}"
              onclick="switchTab('penjaga')">Penjaga Sekolah</button>
          `
        }
      </div>

      ${
        isPosyandu
        ? `
          <div class="category-grid">
            ${['Balita','Ibu Hamil','Ibu Menyusui'].map(c=>`
              <div class="category ${posyanduCategory===c?'active':''}"
                   onclick="setCategory('${c}')">
                ${c}
              </div>
            `).join('')}
          </div>
        `
        :''
      }

      <div class="top-actions" style="margin-bottom:15px">
        <h3 style="margin:0">${typeLabel(activeTab)}</h3>

        <div class="actions">
          <button class="btn btn-success" onclick="openForm()">
            + Tambah
          </button>

          <button class="btn btn-blue" onclick="downloadTemplate()">
            Template Excel
          </button>

          <label class="btn btn-gold">
            Import Excel
            <input
              type="file"
              accept=".xlsx,.xls"
              onchange="importExcel(event)"
              style="display:none">
          </label>

          <button class="btn btn-primary" onclick="exportExcel()">
            Download Excel
          </button>

          <button class="btn btn-light" onclick="refreshTableData(activeTab)">
            ↻ Refresh
          </button>
        </div>
      </div>

      <div id="tableArea"></div>
    </div>

  </main>`;

  loadUnitData();
  loadAnnouncements();
}

async function loadUnitData(){
  const types=session.unitType==='posyandu'
    ? ['posyandu']
    : ['siswa','guru','tendik','penjaga'];

  const stats=document.getElementById('unitStats');

  if(!stats)return;

  stats.innerHTML=types.map(t=>`
    <div class="stat">
      <div>${typeLabel(t)}</div>
      <div class="num">...</div>
    </div>
  `).join('');

  try{
    const results=await Promise.all(
      types.map(t=>apiGet({
        action:'list',
        type:t
      }))
    );

    results.forEach((r,i)=>{
      setCached(types[i],r.rows||[]);
    });

    stats.innerHTML=types.map(t=>`
      <div class="stat">
        <div>${typeLabel(t)}</div>
        <div class="num">${(getCached(t)||[]).length}</div>
      </div>
    `).join('');

    loadTable(activeTab);

  }catch(err){
    toast(err.message,true);
  }
}

function switchTab(t){
  activeTab=t;
  renderUnit();
}

function setCategory(c){
  posyanduCategory=c;
  loadTable('posyandu');
}

async function refreshTableData(type){
  try{
    const r=await apiGet({
      action:'list',
      type
    });

    setCached(type,r.rows||[]);
    loadTable(type);

  }catch(err){
    toast(err.message,true);
  }
}

function loadTable(type){
  const rows=getCached(type);

  if(rows){
    renderTable(type,rows);
  }else{
    document.getElementById('tableArea').innerHTML=
      '<div class="empty">Memuat data...</div>';
  }

  refreshTableData(type).catch(()=>{});
}

function renderTable(type,rows){
  let data=rows||[];

  if(type==='posyandu'){
    data=data.filter(x=>
      (x.kategori||'')===posyanduCategory
    );
  }

  const fields=fieldsFor(type);

  if(!data.length){
    document.getElementById('tableArea').innerHTML=
      '<div class="empty">Belum ada data.</div>';
    return;
  }

  document.getElementById('tableArea').innerHTML=`
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No</th>
            ${fields.map(f=>`<th>${f[1]}</th>`).join('')}
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody>
          ${data.map((r,i)=>`
            <tr>
              <td>${i+1}</td>

              ${fields.map(([key])=>`
                <td>
                  ${key==='tgl'
                    ? esc(formatDate(r[key]))
                    : key==='jenisKelamin'
                    ? `<span class="badge">${esc(r[key])}</span>`
                    : esc(r[key]||'')
                  }
                </td>
              `).join('')}

              <td>
                <div class="actions">
                  <button class="btn btn-sm btn-primary"
                    onclick='openForm(${JSON.stringify(r)})'>
                    Edit
                  </button>

                  <button class="btn btn-sm btn-danger"
                    onclick="deleteData('${type}',${Number(r._row||0)})">
                    Hapus
                  </button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

/* =========================================================
   FORM DATA
========================================================= */

function openForm(row=null){
  editRow=row;

  const type=activeTab;
  const fields=fieldsFor(type);

  const html=`
    <div class="modal-head">
      <h2>${row?'Edit':'Tambah'} ${typeLabel(type)}</h2>
      <button class="btn btn-light" onclick="closeModal()">✕</button>
    </div>

    <form onsubmit="saveData(event)">

      <div class="form-grid">

      ${
        fields.map(([key,label])=>{
          if(key==='kategori'){
            return `
              <div class="form-group">
                <label>${label}</label>
                <select id="f_${key}" onchange="togglePregnancy()">
                  ${['Balita','Ibu Hamil','Ibu Menyusui'].map(x=>`
                    <option ${((row?.kategori||posyanduCategory)===x)?'selected':''}>
                      ${x}
                    </option>
                  `).join('')}
                </select>
              </div>`;
          }

function downloadTemplate(){
  const type=activeTab;
  const fields=fieldsFor(type);

  const headers=fields.map(x=>x[1]);

  const instruction=[
    ['PETUNJUK'],
    ['Jangan mengubah nama kolom.'],
    ['NIK wajib 16 angka.'],
    ['Jenis Kelamin: Laki-laki / Perempuan.'],
    ...(type==='siswa'
      ? [['NISN wajib 5–10 angka.']]
      : []),
    ...(type==='posyandu'
      ? [
          ['Kategori: Balita / Ibu Hamil / Ibu Menyusui.'],
          ['Untuk Ibu Hamil, Usia Kehamilan hanya angka 1, 2, atau 3.']
        ]
      : [])
  ];

  const example={};

  fields.forEach(([key])=>{
    if(key==='nama')example[key]='CONTOH NAMA';
    else if(key==='nik')example[key]='1671000000000001';
    else if(key==='nisn')example[key]='1234567890';
    else if(key==='tgl')example[key]='2015-01-01';
    else if(key==='jenisKelamin')example[key]='Laki-laki';
    else if(key==='kategori')example[key]=
      type==='posyandu'?posyanduCategory:'';
    else if(key==='usiaKehamilan')
      example[key]=posyanduCategory==='Ibu Hamil'?'1':'';
  });

  const row=fields.map(([key])=>example[key]||'');

  const wb=XLSX.utils.book_new();

  const ws1=XLSX.utils.aoa_to_sheet(instruction);
  const ws2=XLSX.utils.aoa_to_sheet([
    headers,
    row
  ]);

  XLSX.utils.book_append_sheet(wb,ws1,'Petunjuk');
  XLSX.utils.book_append_sheet(wb,ws2,typeLabel(type));

  XLSX.writeFile(
    wb,
    `Template_${typeLabel(type).replaceAll(' ','_')}.xlsx`
  );
}

async function importExcel(e){
  const file=e.target.files?.[0];
  if(!file)return;

  try{
    showLoading();

    const buffer=await file.arrayBuffer();
    const wb=XLSX.read(buffer,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[1]||wb.SheetNames[0]];

    const rows=XLSX.utils.sheet_to_json(ws,{
      defval:'',
      raw:false
    });

    if(!rows.length)
      throw new Error('Data Excel kosong.');

    const type=activeTab;
    const valid=[];

    for(let i=0;i<rows.length;i++){
      const r=rows[i];

      const obj={};

      fieldsFor(type).forEach(([key,label])=>{
        obj[key]=r[label]??r[key]??'';
      });

      obj.jenisKelamin=normalizeGender(obj.jenisKelamin);

      const error=validateRow(obj,type);

      if(error)
        throw new Error(`Baris ${i+2}: ${error}`);

      valid.push(obj);
    }

    await apiPost({
      action:'bulkAdd',
      type,
      rows:valid
    });

    clearCache();
    toast(`${valid.length} data berhasil diimpor.`);
    await loadUnitData();

  }catch(err){
    toast(err.message,true);
  }finally{
    e.target.value='';
    showLoading(false);
  }
}

async function exportExcel(){
  try{
    const type=activeTab;

    let rows=getCached(type);

    if(!rows){
      const r=await apiGet({action:'list',type});
      rows=r.rows||[];
    }

    if(type==='posyandu'){
      rows=rows.filter(x=>
        (x.kategori||'')===posyanduCategory
      );
    }

    const fields=fieldsFor(type);

    const output=rows.map(r=>{
      const o={};
      fields.forEach(([key,label])=>{
        o[label]=key==='tgl'
          ? formatDate(r[key])
          : r[key]||'';
      });
      return o;
    });

    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(output);

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      typeLabel(type).substring(0,31)
    );

    XLSX.writeFile(
      wb,
      `Data_${typeLabel(type).replaceAll(' ','_')}.xlsx`
    );

  }catch(err){
    toast(err.message,true);
  }
}

    }

    closeModal();
    toast('Pengumuman berhasil disimpan.');
    renderAnnouncementAdmin();

  }catch(err){
    toast(err.message,true);
  }finally{
    showLoading(false);
  }
}

async function deleteAnnouncement(id){
  if(!confirm('Hapus pengumuman ini?'))return;

  try{
    showLoading();

    await apiPost({
      action:'deleteAnnouncement',
      id
    });

    toast('Pengumuman dihapus.');
    renderAnnouncementAdmin();

  }catch(err){
    toast(err.message,true);
  }finally{
    showLoading(false);
  }
}

/* =========================================================
   MODAL
========================================================= */

function openModal(html){
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalBox').innerHTML='';
  editRow=null;
}

/* =========================================================
   START
========================================================= */

render();
