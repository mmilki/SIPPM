<script>

/* =========================================================
   KONFIGURASI
========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbwnjcwMVX8t2TA_krkxVvRLEmX-M4RQTCyqgHDyTgK1VzlJytI1fWLmzGJQc--TJrsnOg/exec';

const SESSION_KEY = 'sppg_session';

let session =
  JSON.parse(
    localStorage.getItem(SESSION_KEY) || 'null'
  );

let activeTab = 'siswa';

let posyanduCategory = 'Balita';

let kelasCategory = '';

let dataCache = {};

let announcementCache = [];


/* =========================================================
   API
========================================================= */

async function apiGet(params = {}) {

  const query = new URLSearchParams(params);

  if (session?.token) {
    query.set('token', session.token);
  }

  const response =
    await fetch(
      API_URL + '?' + query.toString()
    );

  const data =
    await response.json();

  if (!data.ok) {
    throw new Error(
      data.error || 'Terjadi kesalahan'
    );
  }

  return data;

}


async function apiPost(payload = {}) {

  const body = {
    ...payload
  };

  if (session?.token) {
    body.token = session.token;
  }

  const response =
    await fetch(
      API_URL,
      {
        method:'POST',
        headers:{
          'Content-Type':'text/plain;charset=utf-8'
        },
        body:JSON.stringify(body)
      }
    );

  const data =
    await response.json();

  if (!data.ok) {
    throw new Error(
      data.error || 'Terjadi kesalahan'
    );
  }

  return data;

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function toast(message){

  alert(message);

}


function saveSession(){

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify(session)
  );

}


function clearSession(){

  session = null;

  localStorage.removeItem(
    SESSION_KEY
  );

  dataCache = {};

  render();

}


function normalizeGenderFE(value){

  const v =
    String(value || '')
      .trim()
      .toUpperCase();

  if(
    v === 'L' ||
    v === 'LAKI' ||
    v === 'LAKI-LAKI' ||
    v === 'LAKI LAKI' ||
    v === 'PRIA'
  ){
    return 'Laki-laki';
  }

  if(
    v === 'P' ||
    v === 'PEREMPUAN' ||
    v === 'WANITA'
  ){
    return 'Perempuan';
  }

  return '';
}


function kelasOptionsForTingkat(tingkat){

  const t =
    String(tingkat || '')
      .trim()
      .toUpperCase();

  if(t === 'SD'){
    return ['1','2','3','4','5','6'];
  }

  if(t === 'SMP'){
    return ['7','8','9'];
  }

  return [];

}


function schoolTabsForTingkat(tingkat){

  const t =
    String(tingkat || '')
      .trim()
      .toUpperCase();

  if(t === 'KB'){

    return [
      ['siswa','Siswa'],
      ['guru','Guru']
    ];

  }

  return [
    ['siswa','Siswa'],
    ['guru','Guru'],
    ['tendik','Tendik'],
    ['penjaga','Penjaga Sekolah']
  ];

}


function formatDate(value){

  if(!value) return '';

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleDateString(
    'id-ID',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  );

}


function formatDateTime(value){

  if(!value) return '';

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleString(
    'id-ID',
    {
      dateStyle:'medium',
      timeStyle:'short'
    }
  );

}

========================================================= */

/* =========================================================
   VALIDASI
========================================================= */

function validateRow(obj,type){

  const nama =
    String(obj.nama || '').trim();

  if(!nama){
    return 'Nama wajib diisi';
  }


  const nik =
    String(obj.nik || '')
      .replace(/\D/g,'');

  if(!/^\d{16}$/.test(nik)){
    return 'NIK harus tepat 16 digit';
  }


  if(type === 'siswa'){

    const nisn =
      String(obj.nisn || '')
        .replace(/\D/g,'');

    if(!/^\d{5,10}$/.test(nisn)){
      return 'NISN harus 5-10 digit';
    }


    const kelasOptions =
      kelasOptionsForTingkat(
        session?.tingkat
      );

    if(kelasOptions.length){

      const kelas =
        String(obj.kelas || '').trim();

      if(!kelasOptions.includes(kelas)){

        return (
          'Kelas wajib dipilih (' +
          kelasOptions.join(', ') +
          ')'
        );

      }

    }

  }


  if(!obj.tgl){
    return 'Tanggal lahir wajib diisi';
  }


  const d =
    new Date(obj.tgl);

  if(isNaN(d.getTime())){
    return 'Tanggal lahir tidak valid';
  }


  const today =
    new Date();

  today.setHours(
    23,59,59,999
  );

  if(d > today){
    return 'Tanggal lahir tidak boleh di masa depan';
  }


  if(
    type === 'siswa' ||
    type === 'guru' ||
    type === 'tendik' ||
    type === 'penjaga' ||
    type === 'posyandu'
  ){

    if(
      obj.jenisKelamin !== 'Laki-laki' &&
      obj.jenisKelamin !== 'Perempuan'
    ){

      return 'Jenis kelamin wajib dipilih';

    }

  }


  if(type === 'posyandu'){

    if(!obj.kategori){
      return 'Kategori Posyandu wajib dipilih';
    }


    if(obj.kategori === 'Ibu Hamil'){

      if(
        !/^[123]$/.test(
          String(
            obj.usiaKehamilan || ''
          )
        )
      ){

        return 'Usia kehamilan harus 1, 2, atau 3';

      }

    }

  }


  return '';

}


/* =========================================================
   RENDER
========================================================= */

  if(session.role === 'admin'){

    cacheKey(type)

/* =========================================================
   STATS
========================================================= */

async function loadStats(types){

  const area =
    document.getElementById(
      'statsArea'
    );

  if(!area) return;


  const cached =
    types.map(
      t => getCachedRows(t).length
    );


  area.innerHTML = `

    <div class="stats">

      ${types.map((type,i) => `

        <div class="card stat">

          <div class="stat-label">
            ${labelType(type)}
          </div>

          <div class="stat-value">
            ${cached[i]}
          </div>

        </div>

      `).join('')}

    </div>

  `;


  try{

    const results =
      await Promise.all(
        types.map(
          type =>
            apiGet({
              action:'list',
              type
            })
        )
      );


    results.forEach(
      (result,i) => {

        setCachedRows(
          types[i],
          result.rows || []
        );

      }
    );


    area.innerHTML = `

      <div class="stats">

        ${types.map(type => `

          <div class="card stat">

            <div class="stat-label">
              ${labelType(type)}
            </div>

            <div class="stat-value">
              ${getCachedRows(type).length}
            </div>

          </div>

        `).join('')}

      </div>

    `;


    if(activeTab === 'posyandu'){
      const areaCat =
        document.querySelector('.category-grid');

      if(areaCat){
        areaCat.outerHTML =
          renderPosyanduCategories();
      }
    }


    if(activeTab === 'siswa'){
      const areaCat =
        document.querySelector('.category-grid');

      if(areaCat){
        areaCat.outerHTML =
          renderKelasCategories();
      }
    }


  }catch(err){

    console.error(err);

  }

}


function labelType(type){

  const map = {
    siswa:'Siswa',
    guru:'Guru',
    tendik:'Tendik',
    penjaga:'Penjaga Sekolah',
    posyandu:'Posyandu'
  };

  return map[type] || type;

}


/* =========================================================
   TABLE
========================================================= */

async function loadTable(type){

  const area =
    document.getElementById(
      'tableArea'
    );

  if(!area) return;


  const cached =
    getCachedRows(type);


  renderTable(
    area,
    type,
    cached,
    true
  );


  try{

    const result =
      await apiGet({
        action:'list',
        type
      });


    setCachedRows(
      type,
      result.rows || []
    );


    renderTable(
      area,
      type,
      result.rows || [],
      false
    );

  }catch(err){

    area.innerHTML =
      `<div class="notice notice-danger">
        ${esc(err.message)}
      </div>`;

  }

}


function refreshTableData(type){

  return loadTable(type);

}

   RENDER TABLE
========================================================= */

function renderTable(
  area,
  type,
  rows,
  cached
){

  let filtered =
    rows || [];


  if(type === 'posyandu'){

    filtered =
      filtered.filter(
        r =>
          String(
            r.Kategori || ''
          ) === posyanduCategory
      );

  }


  if(type === 'siswa'){

    const kelasOptions =
      kelasOptionsForTingkat(
        session.tingkat
      );

    if(kelasOptions.length){

      filtered =
        filtered.filter(
          r =>
            String(
              r.Kelas || ''
            ) === kelasCategory
        );

    }

  }


  const fields =
    fieldsFor(type);


  area.innerHTML = `

    <div class="card toolbar">

      <div class="toolbar-left">

        <button
          class="btn btn-primary"
          onclick="openForm('${type}')"
        >
          + Tambah
        </button>

        <button
          class="btn btn-light"
          onclick="downloadTemplate('${type}')"
        >
          Template Excel
        </button>

        <label class="btn btn-light">
          Import Excel
          <input
            class="hidden-file"
            type="file"
            accept=".xlsx,.xls,.csv"
            onchange="importExcel(event,'${type}')"
          >
        </label>

      </div>


      <div class="toolbar-right">

        <button
          class="btn btn-success"
          onclick="exportExcel('${type}')"
        >
          Download Excel
        </button>

      </div>

    </div>


    <div class="card table-card">

      ${
        !filtered.length

        ? `
          <div class="empty">
            Belum ada data ${esc(labelType(type))}.
          </div>
        `

        : `

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>No</th>

                ${
                  type === 'posyandu'
                  ? '<th>Kategori</th>'
                  : ''
                }

                ${fields.map(
                  f => `<th>${esc(f.label)}</th>`
                ).join('')}

                <th>Aksi</th>

              </tr>

            </thead>


            <tbody>

              ${filtered.map(
                (row,i) => {

                  return `

                    <tr>

                      <td>${i + 1}</td>

                      ${
                        type === 'posyandu'
                        ? `<td>
                            <span class="badge badge-blue">
                              ${esc(row.Kategori)}
                            </span>
                          </td>`
                        : ''
                      }

                      ${fields.map(
                        f => {

                          let value =
                            getRowValue(
                              row,
                              f.key
                            );


                          if(f.key === 'jenisKelamin'){

                            value =
                              normalizeGenderFE(
                                value
                              );

                          }


                          if(f.key === 'tgl'){

                            value =
                              formatDate(
                                value
                              );

                          }


                          if(
                            f.key ===
                            'usiaKehamilan'
                          ){

                            value =
                              value
                              ? 'Trimester ' +
                                value
                              : '-';

                          }


                          if(
                            f.key === 'kelas'
                          ){

                            value =
                              value
                              ? 'Kelas ' + value
                              : '-';

                          }


                          return `<td>
                            ${esc(value || '-')}
                          </td>`;

                        }
                      ).join('')}


                      <td>

                        <div class="actions">

                          <button
                            class="btn btn-light btn-sm"
                            onclick='openForm(
                              "${type}",
                              ${JSON.stringify(row).replace(/'/g,"&#39;")}
                            )'
                          >
                            Edit
                          </button>

                          <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteRow('${type}',${Number(row._row)})"
                          >
                            Hapus
                          </button>

                        </div>

                      </td>

                    </tr>

                  `;

                }
              ).join('')}

            </tbody>

          </table>

        </div>

        `

      }

    </div>

  `;

}


function getRowValue(row,key){

  if(key === 'nama'){
    return row.Nama || '';
  }

  if(key === 'nisn'){
    return row.NISN || '';
  }

  if(key === 'nik'){
    return row.NIK || '';
  }

  if(key === 'tgl'){
    return row['Tanggal Lahir'] || '';
  }

  if(key === 'jenisKelamin'){
    return row['Jenis Kelamin'] || '';
  }

  if(key === 'usiaKehamilan'){
    return row['Usia Kehamilan'] || '';
  }

  if(key === 'kelas'){
    return row.Kelas || '';
  }

  return '';

}

function renderField(field,row,type){

  let value =
    getRowValue(
      row || {},
      field.key
    );


  if(field.key === 'jenisKelamin'){
    value =
      normalizeGenderFE(value);
  }


  if(field.key === 'tgl' && value){

    const d =
      new Date(value);

    if(!isNaN(d.getTime())){

      value =
        d.toISOString()
         .slice(0,10);

    }

  }


  if(field.type === 'gender'){

    return `

      <div class="form-group">

        <label class="form-label">
          ${field.label}
        </label>

        <select
          class="form-control"
          id="form_${field.key}"
          required
        >

          <option value="">
            Pilih Jenis Kelamin
          </option>

          <option
            value="Laki-laki"
            ${value === 'Laki-laki' ? 'selected' : ''}
          >
            Laki-laki
          </option>

          <option
            value="Perempuan"
            ${value === 'Perempuan' ? 'selected' : ''}
          >
            Perempuan
          </option>

        </select>

      </div>

    `;

  }


  if(field.type === 'kelas'){

    const options =
      kelasOptionsForTingkat(
        session.tingkat
      );

    if(!options.length){
      return '';
    }

    return `

      <div class="form-group">

        <label class="form-label">
          ${field.label}
        </label>

        <select
          class="form-control"
          id="form_kelas"
          required
        >

          <option value="">
            Pilih Kelas
          </option>

          ${options.map(k => `

            <option
              value="${k}"
              ${value === k ? 'selected' : ''}
            >
              Kelas ${k}
            </option>

          `).join('')}

        </select>

      </div>

    `;

  }


  if(field.type === 'pregnancy'){

    return `

      <div
        class="form-group"
        id="pregnancyGroup"
      >

        <label class="form-label">
          ${field.label}
        </label>

        <input
          id="form_usiaKehamilan"
          class="form-control"
          type="text"
          inputmode="numeric"
          pattern="[123]"
          maxlength="1"
          value="${esc(value)}"
          placeholder="1 / 2 / 3"
          oninput="this.value=this.value.replace(/[^123]/g,'').slice(0,1)"
        >

        <small style="color:#6d7788">
          1 = Trimester 1,
          2 = Trimester 2,
          3 = Trimester 3
        </small>

      </div>

    `;

  }


  return `

    <div class="form-group">

      <label class="form-label">
        ${field.label}
      </label>

      <input
        id="form_${field.key}"
        class="form-control"
        type="${field.type}"
        value="${esc(value)}"
        ${field.required ? 'required' : ''}
        ${
          field.numeric
          ? 'inputmode="numeric"'
          : ''
        }
        ${
          field.maxLength
          ? `maxlength="${field.maxLength}"`
          : ''
        }
        ${
          field.numeric
          ? `oninput="this.value=this.value.replace(/\\D/g,'')"`
          : ''
        }
      >

    </div>

  `;

}


function togglePregnancyField(){

  const group =
    document.getElementById(
      'pregnancyGroup'
    );

  const category =
    document.getElementById(
      'form_kategori'
    );


  if(!group) return;


  if(
    category &&
    category.value === 'Ibu Hamil'
  ){

    group.style.display =
      'block';

  }else{

    group.style.display =
      'none';

  }

}


/* =========================================================
   SAVE FORM
========================================================= */

async function saveForm(
  event,
  type,
  rowNumber
){

  event.preventDefault();


  const obj = {};


  fieldsFor(type).forEach(
    field => {

      const el =
        document.getElementById(
          'form_' + field.key
        );

      if(el){

        obj[field.key] =
          el.value.trim();

      }

    }
  );


  if(type === 'posyandu'){

    obj.kategori =
      document.getElementById(
        'form_kategori'
      ).value;

  }


  obj.jenisKelamin =
    normalizeGenderFE(
      obj.jenisKelamin
    );


  const error =
    validateRow(
      obj,
      type
    );


  if(error){

    toast(error);

    return;

  }


  try{

    if(rowNumber){

      await apiPost({

        action:'update',

        type,

        row:rowNumber,

        data:obj

      });

    }else{

      await apiPost({

        action:'add',

        type,

        data:obj

      });

    }


    closeModal();

    delete dataCache[
      cacheKey(type)
    ];

    await loadTable(type);

    toast(
      rowNumber
      ? 'Data berhasil diperbarui'
      : 'Data berhasil ditambahkan'
    );


  }catch(err){

    toast(err.message);

  }

}


function closeModal(){

  const modal =
    document.getElementById(
      'dataModal'
    );

  if(modal){
    modal.remove();
  }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteRow(
  type,
  row
){

  if(!confirm(
    'Yakin ingin menghapus data ini?'
  )){
    return;
  }


  try{

    await apiPost({

      action:'delete',

      type,

      row

    });


    delete dataCache[
      cacheKey(type)
    ];


    await loadTable(type);


    toast(
      'Data berhasil dihapus'
    );


  }catch(err){

    toast(err.message);

  }

}


/* =========================================================
   TEMPLATE EXCEL
========================================================= */

function downloadTemplate(type){

  const wb =
    XLSX.utils.book_new();


  let headers = [];

  let rows = [];


  if(type === 'siswa'){

    headers = [
      'Nama',
      'NISN',
      'NIK',
      'Tanggal Lahir',
      'Jenis Kelamin',
      'Kelas'
    ];

    rows = [[
      'Contoh Nama Siswa',
      '1234567890',
      '1600000000000001',
      '2015-01-01',
      'Laki-laki',
      '1'
    ]];

  }


  if(
    type === 'guru' ||
    type === 'tendik' ||
    type === 'penjaga'
  ){

    headers = [
      'Nama',
      'NIK',
      'Tanggal Lahir',
      'Jenis Kelamin'
    ];

    rows = [[
      'Contoh Nama',
      '1600000000000001',
      '1985-01-01',
      'Laki-laki'
    ]];

  }


  if(type === 'posyandu'){

    headers = [
      'Kategori',
      'Nama',
      'NIK',
      'Tanggal Lahir',
      'Jenis Kelamin',
      'Usia Kehamilan'
    ];

    rows = [

      [
        'Balita',
        'Contoh Balita',
        '1600000000000001',
        '2022-01-01',
        'Laki-laki',
        ''
      ],

      [
        'Ibu Hamil',
        'Contoh Ibu Hamil',
        '1600000000000002',
        '1995-01-01',
        'Perempuan',
        '2'
      ]

    ];

  }


  const ws =
    XLSX.utils.aoa_to_sheet([
      headers,
      ...rows
    ]);


  XLSX.utils.book_append_sheet(
    wb,
    ws,
    labelType(type)
  );


  XLSX.writeFile(
    wb,
    'Template_' +
    labelType(type).replace(/ /g,'_') +
    '.xlsx'
  );

}


/* =========================================================
   IMPORT EXCEL
========================================================= */

async function importExcel(
  event,
  type
){

  const file =
    event.target.files[0];

  if(!file) return;


  try{

    const buffer =
      await file.arrayBuffer();


    const workbook =
      XLSX.read(
        buffer,
        {type:'array'}
      );


    const sheet =
      workbook.Sheets[
        workbook.SheetNames[0]
      ];


    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {defval:''}
      );


    const converted = [];


    rows.forEach(
      row => {

        const obj = {

          nama:
            row.Nama || '',

          nik:
            String(
              row.NIK || ''
            ).replace(/\D/g,''),

          tgl:
            convertExcelDate(
              row['Tanggal Lahir']
            ),

          jenisKelamin:
            normalizeGenderFE(
              row['Jenis Kelamin']
            )

        };


        if(type === 'siswa'){

          obj.nisn =
            String(
              row.NISN || ''
            ).replace(/\D/g,'');


          obj.kelas =
            String(
              row.Kelas || ''
            ).trim();

        }


        if(type === 'posyandu'){

          obj.kategori =
            row.Kategori || '';


          obj.usiaKehamilan =
            String(
              row['Usia Kehamilan'] || ''
            )
            .replace(/\D/g,'')
            .slice(0,1);

        }


        converted.push(obj);

      }
    );


    const valid = [];

    const errors = [];


    converted.forEach(
      (obj,i) => {

        const error =
          validateRow(
            obj,
            type
          );


        if(error){

          errors.push(
            'Baris ' +
            (i + 2) +
            ': ' +
            error
          );

        }else{

          valid.push(obj);

        }

      }
    );


    if(!valid.length){

      alert(
        'Tidak ada data valid.\n\n' +
        errors.join('\n')
      );

      return;

    }


    const result =
      await apiPost({

        action:'bulkAdd',

        type,

        rows:valid

      });


    delete dataCache[
      cacheKey(type)
    ];


    await loadTable(type);


    let message =
      result.message || 'Import selesai';


    if(errors.length){

      message +=
        '\n\nData yang tidak masuk:\n' +
        errors.slice(0,10).join('\n');

      if(errors.length > 10){

        message +=
          '\n... dan ' +
          (errors.length - 10) +
          ' lainnya.';

      }

    }


    alert(message);


  }catch(err){

    alert(
      'Import gagal: ' +
      err.message
    );

  }


  event.target.value = '';

}


function convertExcelDate(value){

  if(!value) return '';


  if(
    typeof value === 'number'
  ){

    const date =
      XLSX.SSF.parse_date_code(
        value
      );

    if(date){

      return [
        date.y,
        String(date.m).padStart(2,'0'),
        String(date.d).padStart(2,'0')
      ].join('-');

    }

  }


  const d =
    new Date(value);

  if(!isNaN(d.getTime())){

    return d
      .toISOString()
      .slice(0,10);

  }


  return String(value);

}


/* =========================================================
   EXPORT EXCEL
========================================================= */

function exportExcel(type){

  let rows =
    getCachedRows(type);


  if(type === 'posyandu'){

    rows =
      rows.filter(
        r =>
          String(
            r.Kategori || ''
          ) === posyanduCategory
      );

  }


  const fields =
    fieldsFor(type);


  const output =
    rows.map(row => {

      const obj = {};


      if(type === 'posyandu'){

        obj.Kategori =
          row.Kategori || '';

      }


      fields.forEach(
        field => {

          let value =
            getRowValue(
              row,
              field.key
            );


          if(field.key === 'jenisKelamin'){

            value =
              normalizeGenderFE(value);

          }


          obj[field.label] =
            value || '';

        }
      );


      return obj;

    });


  const ws =
    XLSX.utils.json_to_sheet(
      output
    );


  const wb =
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    wb,
    ws,
    labelType(type)
  );


  XLSX.writeFile(
    wb,
    'Data_' +
    labelType(type).replace(/ /g,'_') +
    '.xlsx'
  );

}
